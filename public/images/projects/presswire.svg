<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PressWire">
  <defs>
    <pattern id="paper" width="210" height="210" patternUnits="userSpaceOnUse">
      <rect width="210" height="210" fill="#F4EFE4"/>
      <circle cx="5" cy="8" r="1" fill="#000000" opacity="0.05"/>
      <circle cx="120" cy="60" r="1" fill="#000000" opacity="0.05"/>
      <circle cx="70" cy="150" r="1" fill="#000000" opacity="0.05"/>
    </pattern>
    <linearGradient id="paste" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A1628" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#paper)"/>

  <rect x="40" y="34" width="560" height="4" fill="#1A1A18"/>

  <text x="44" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="600" letter-spacing="6" fill="#1A1A18">PRESSWIRE</text>

  <rect x="44" y="132" width="118" height="10" fill="#C8322B"/>
  <text x="166" y="141" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#1A1A18" opacity="0.85">MASTHEAD · VOL IX / NO 4</text>
  <text x="530" y="141" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#1A1A18" opacity="0.85">FOUNDER EDITION</text>

  <rect x="44" y="160" width="552" height="2" fill="#1A1A18" opacity="0.85"/>

  <rect x="44" y="186" width="262" height="126" fill="#E4DCCB"/>
  <rect x="44" y="186" width="262" height="126" fill="none" stroke="#1A1A18" stroke-width="1.5"/>
  <text x="175" y="246" font-family="Georgia, serif" font-size="20" letter-spacing="1" fill="#1A1A18" opacity="0.75">PHOTO</text>
  <text x="175" y="270" font-family="'Courier New', monospace" font-size="11" letter-spacing="2" fill="#1A1A18" opacity="0.6" text-anchor="middle">DATAPRESS</text>
  <rect x="56" y="292" width="238" height="10" fill="#C8322B"/>

  <rect x="328" y="182" width="40" height="4" fill="#C8322B"/>
  <text x="328" y="216" font-family="Georgia, serif" font-size="30" font-weight="600" fill="#1A1A18">THE PEOPLE'S</text>
  <text x="328" y="250" font-family="Georgia, serif" font-size="30" font-weight="600" fill="#1A1A18">WIRE TO THE WORLD</text>

  <text x="44" y="342" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" fill="#1A1A18" opacity="0.8">NEWS</text>
  <text x="290" y="342" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" fill="#1A1A18" opacity="0.8">PREMIUM SUBSCRIPTIONS</text>

  <rect x="44" y="352" width="552" height="14" fill="#1A1A18"/>
  <text x="320" y="363" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#F4EFE4" text-anchor="middle">AUTHORS · EDITORS · READERS</text>

  <rect x="0" y="0" width="640" height="400" fill="url(#paste)"/>
